[pytest]
minversion = 7.0

# options applied on every run
addopts = -v --strict-markers --alluredir=allure-results

# where the tests live
testpaths = tests

# rules by which pytest discovers tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# registration of custom markers
markers =
    smoke: quick checks of core functionality
    regression: full regression suite
    api: API tests
    ui: UI tests

# logging
log_cli = false
log_level = INFO
show_capture = log